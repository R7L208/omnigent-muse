name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["Feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve, or what use case would this enable?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - MSP transport
        - Executor and event translation
        - Approvals and policy
        - Installation and discovery
        - Documentation
        - Other
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Expected reach
      options:
        - Most users
        - A substantial user segment
        - Some users
        - One narrow or edge case
        - Unknown
    validations:
      required: false
