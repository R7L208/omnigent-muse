name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compat-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  gate:
    uses: ./.github/workflows/security-gate.yml

  pytest:
    name: Pytest (Python ${{ matrix.python }})
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - name: Check out plugin
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: omnigent-muse
          persist-credentials: false

      - name: Check out latest Omnigent
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: omnigent-ai/omnigent
          path: omnigent
          persist-credentials: false

      - name: Check out latest Muse SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: meta-models/muse-code-sdk
          path: muse-code-sdk
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: omnigent-muse/pyproject.toml

      - name: Install plugin with dependency heads
        working-directory: omnigent-muse
        # uv.lock is not committed, so `uv sync` resolves the newest released
        # Omnigent; replace it with main, non-editable, as `just core-sibling`
        # does locally.
        run: |
          uv sync --group dev
          uv pip install --python .venv/bin/python \
            --reinstall-package omnigent --no-editable ../omnigent

      - name: Run tests
        working-directory: omnigent-muse
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest -q

      - name: Verify plugin discovery
        working-directory: omnigent-muse
        run: uv run --no-sync python .github/scripts/release/check-release.py discovery

  released:
    # The unit suite against the released Omnigent versions the package
    # supports: the floor pyproject.toml declares, and the latest release.
    # The pytest job above covers Omnigent main.
    name: Pytest (Omnigent ${{ matrix.omnigent }})
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        omnigent: [minimum, latest]

    steps:
      - name: Check out plugin
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install plugin with released Omnigent
        env:
          OMNIGENT: ${{ matrix.omnigent }}
        run: |
          spec="$(python .github/scripts/release/check-release.py spec "$OMNIGENT")"
          # Everything but Omnigent from the sync, then Omnigent once, at the
          # version this leg tests.
          uv sync --group dev --no-install-package omnigent
          uv pip install --python .venv/bin/python "$spec"
          .venv/bin/python -c 'import importlib.metadata as m; print("omnigent", m.version("omnigent"))'

      - name: Run tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest -q

      - name: Verify plugin discovery
        run: uv run --no-sync python .github/scripts/release/check-release.py discovery
